# CI for Void Maiz — and specifically: does the view compile off Windows?
#
# WHY THIS EXISTS. Void Hormiga asked on 2026-09-08 whether Void Maiz builds on
# Linux and macOS, because both of their binaries link us and there is no
# configuration of Void Hormiga that reaches a non-Windows desktop without Void
# Maiz on it. We could not answer from evidence: `void.json` recorded
# `["windows-x64", "android-arm64"]`, which was a record of what had been BUILT,
# and nobody had ever tried the other two. Neither project owns a Linux or macOS
# machine, and that second-computer constraint has been sitting in front of
# their phase F exit test since 2026-08-27.
#
# A runner is the second computer. This workflow is the answer to their question
# in a form that keeps answering it after today, which a message cannot do.
#
# WHAT IT PROVES AND WHAT IT DOES NOT. It proves the library, the tests and the
# GUI examples COMPILE and that the headless suite RUNS, on all three. It does
# not prove a window opens: no runner has a display, and "it ran there" for a
# GUI means a human saw it. The macOS GL context in `voidmaiz/glhost.hpp` is
# therefore reasoned-and-compiled, not witnessed — see okf/log.md, 2026-09-08.
name: ci

on:
  push:
    # `ios` is the branch the iOS shell is developed on: a push there runs the
    # Simulator job (below) without touching main.
    branches: [main, ios]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Never fail-fast: the whole point is to see all three verdicts, and a
      # red Windows leg must not hide a green Linux one.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      # The three repos are SIBLINGS on disk — our CMake defaults are
      # `../VoidCore/core` and `../VoidAllomone`, so the checkout has to
      # reproduce that layout rather than the usual single-repo one.
      - uses: actions/checkout@v4
        with:
          path: VoidMaiz

      # Note the folder names: the GitHub repo is `void-core`, the sibling
      # directory the family uses is `VoidCore`.
      - name: Check out the siblings
        shell: bash
        run: |
          git clone --depth 1 https://github.com/migriv24/void-core.git VoidCore
          git clone --depth 1 https://github.com/migriv24/VoidAllomone.git VoidAllomone
          # OPTIONAL: Void Palabra enables `voidmaiz_net` (networking, stage C).
          # Without it the rest of the library builds and tests exactly as
          # before — that is the claim, and the step below reports which
          # configuration this run actually exercised.
          git clone --depth 1 https://github.com/migriv24/VoidPalabra.git VoidPalabra || true

      # GLFW 3.4 builds BOTH an X11 and a Wayland backend on Linux by default
      # (vendor/glfw/CMakeLists.txt gates them on UNIX;NOT APPLE), so configure
      # needs both sets of development headers even though a runner will never
      # open a window. This is the step a first-time Linux builder is most
      # likely to be missing, and it is a system-package prerequisite rather
      # than anything wrong with the source.
      - name: Linux window-system headers (GLFW build dependency)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      # Void Maiz links the core as a prebuilt shared library on desktop, so it
      # has to exist before we configure. Same command Void Core's own CI uses.
      - name: Build Void Core
        shell: bash
        run: cmake -S VoidCore/core -B VoidCore/core/build -DCMAKE_BUILD_TYPE=Release && cmake --build VoidCore/core/build --config Release

      - name: Configure Void Maiz
        shell: bash
        run: cmake -S VoidMaiz -B VoidMaiz/build -DCMAKE_BUILD_TYPE=Release

      # Builds everything, GUI examples included: `maiz_canvas` and
      # `maiz_allomone` link the view module, GLFW and ImGui, so a compile
      # failure in the window layer fails here even though nothing is displayed.
      - name: Build
        shell: bash
        run: cmake --build VoidMaiz/build --config Release

      # Say out loud whether networking was in this run. A clone of a Palabra
      # that predates its sync session (sync.hpp) configures WITHOUT
      # voidmaiz_net, by design — and a silent skip would read as a pass.
      - name: Report the networking configuration
        shell: bash
        run: |
          if ls VoidMaiz/build/*voidmaiz_net* VoidMaiz/build/*/*voidmaiz_net* >/dev/null 2>&1; then
            echo "::notice::voidmaiz_net built — net_smoke runs in this job"
          else
            echo "::warning::voidmaiz_net NOT built (Void Palabra absent or without sync.hpp) — networking untested in this job"
          fi

      # The suite is entirely headless — no test target links voidmaiz_view.
      #
      # `reduce_conformance` is EXCLUDED, and not to buy a green badge: it is
      # knowingly at 17/25 because Void Core extended the portable reduce
      # contract on 2026-09-01 with boxes, a reserved separator and a `patch`
      # rule that this port does not implement yet. It is on our backlog, it is
      # not a regression, and it is not a portability signal — so it must not
      # mask one. It runs on its own below, where its number is visible and
      # cannot be mistaken for a platform verdict.
      - name: Test (headless suite)
        shell: bash
        working-directory: VoidMaiz/build
        run: ctest --output-on-failure -C Release -E reduce_conformance

      - name: Reduce conformance (known 17/25 — reported, not gating)
        shell: bash
        working-directory: VoidMaiz/build
        continue-on-error: true
        run: ctest --output-on-failure -C Release -R reduce_conformance

  # ── iOS, from a machine with no Mac (2026-10-17) ───────────────────────────
  #
  # Nobody in the family owns a Mac, and Void Maiz's iOS shell
  # (src/shell/shell_ios.mm) was written on Windows. This runner is the Mac. It
  # proves three things, in order of how much they are worth:
  #   1. the library, the shell and the example COMPILE for iOS (device and
  #      Simulator; arm64 both);
  #   2. the app LAUNCHES in the iOS Simulator and is still running 20 s later
  #      (no crash at start, no crash on the first frames);
  #   3. a SCREENSHOT of it, uploaded as an artifact, which is how a person on
  #      Windows looks at an iOS build.
  # It does not prove a finger works (the Simulator gets no touches here), nor
  # anything about a real device, signing, or the App Store. See
  # okf/concepts/ios.md.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: VoidMaiz

      # No Void Palabra: networking is not on iOS yet (UDP broadcast there needs
      # an entitlement Apple must grant; see okf/concepts/ios.md).
      - name: Check out the siblings
        run: |
          git clone --depth 1 https://github.com/migriv24/void-core.git VoidCore
          git clone --depth 1 https://github.com/migriv24/VoidAllomone.git VoidAllomone

      - name: Toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Build for a device (arm64, unsigned)
        run: |
          cmake -S VoidMaiz -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DMAIZ_BUILD_TESTS=OFF
          cmake --build build-ios --config Release --target maiz_portable --             CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build for the Simulator
        run: |
          cmake -S VoidMaiz -B build-sim -G Xcode -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DMAIZ_BUILD_TESTS=OFF
          cmake --build build-sim --config Debug --target maiz_portable --             CODE_SIGNING_ALLOWED=NO -quiet
          APP=$(find build-sim -name maiz_portable.app -type d | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          codesign --force --sign - "$APP"   # ad hoc: what the Simulator needs to launch it
          plutil -p "$APP/Info.plist" | head -20

      - name: Run it in the Simulator
        run: |
          # the newest available iPhone, whatever this image's Xcode ships
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for rt, xs in sorted(d.items()) if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" org.voidmaiz.portable
          sleep 20
          mkdir -p ios-out
          xcrun simctl io "$UDID" screenshot ios-out/simulator.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact             --predicate 'process == "maiz_portable"' > ios-out/app.log || true
          # still running = it survived its start and its first frames
          xcrun simctl spawn "$UDID" launchctl list | grep org.voidmaiz.portable             || { echo "::error::maiz_portable is not running 20 s after launch"; tail -50 ios-out/app.log; exit 1; }

      - name: Background and back (the save path)
        run: |
          xcrun simctl launch "$UDID" com.apple.Preferences   # puts our app in the background
          sleep 5
          xcrun simctl launch "$UDID" org.voidmaiz.portable
          sleep 5
          xcrun simctl io "$UDID" screenshot ios-out/after-background.png
          DATA=$(xcrun simctl get_app_container "$UDID" org.voidmaiz.portable data)
          ls -la "$DATA/Library/Application Support" || true
          test -f "$DATA/Library/Application Support/portable.state.json"             || { echo "::error::no state document after going to the background"; exit 1; }

      - name: Upload what the Simulator showed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: ios-out/
